name: Build Payloads

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Payload with Makefile
        run: |
          make ANDROID_NDK_HOME=$ANDROID_NDK_HOME || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payload-built-artifact
          path: |
            build/
            artifacts/
            profiles/
          if-no-files-found: ignore
